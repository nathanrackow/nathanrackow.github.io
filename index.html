<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rackalize Transportation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      /* Background */
      background: linear-gradient(135deg, #0f172a, #020617);

      /* Text */
      color: #ffffff;

      /* Layout */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      padding: 40px;
      box-sizing: border-box;
    }

    /* LOGO */
    img {
      max-width: 260px;
      margin-bottom: 30px;
    }

    /* MAIN TITLE — RESPONSIVE & CLEAN */
    h1 {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      line-height: 1.1;
      margin-bottom: 15px;
      word-break: keep-all;
    }

    /* AUTHORITY NUMBERS */
    .authority {
      font-size: clamp(1.1rem, 2.8vw, 1.4rem);
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    /* SECTION HEADERS */
    h2 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin-top: 50px;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* BODY TEXT */
    p {
      font-size: clamp(1.3rem, 3.5vw, 1.8rem);
      max-width: 900px;
      line-height: 1.6;
      margin: 0 auto 10px auto;
    }

    .services p,
    .contact p {
      font-size: clamp(1.4rem, 3.8vw, 1.9rem);
    }

    footer {
      margin-top: 60px;
      font-size: 1.1rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <img src="logo.png" alt="Rackalize Transportation Logo">

  <!-- COMPANY NAME -->
  <h1>
    Rackalize<br>
    Transportation
  </h1>

  <!-- DOT & MC AUTHORITY -->
  <div class="authority">
    USDOT #4507992 &nbsp; | &nbsp; MC #76602270
  </div>

  <!-- TAGLINE -->
  <p>
    Reliable, owner-operated freight services.
  </p>

  <!-- SERVICES -->
  <h2>Services</h2>
  <div class="services">
    <p>
      • Dry Van<br>
      • Power-Only<br>
      • Local & Regional
    </p>
  </div>

  <!-- SERVICE AREA -->
  <h2>Service Area</h2>
  <p>
    Alabama • Georgia • Southeast US
  </p>

  <!-- CONTACT -->
  <h2>Contact</h2>
  <div class="contact">
    <p>
      📞 (706) 518-3255<br>
      📧 rackalize@gmail.com
    </p>
  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 Rackalize Transportation
  </footer>

</body>
</html>
